# Continuous integration: test the four packages and build the Sphinx site.
# On pushes to main the HTML documentation is also published to GitHub Pages.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [Model_A, Model_B, Model_C, Model_D]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        working-directory: src/${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest scikit-learn
      - name: Run tests
        working-directory: src/${{ matrix.package }}
        run: python -m pytest -q tests

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build Sphinx documentation
        run: sphinx-build -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: docs/_build/html

  deploy-docs:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
