[tool.poetry]
name = "industrial-semantic-model-c"
version = "1.0.0"
description = "Contextual operating/working modes and incident-family semantics (Model C)"
authors = ["Antonio Bello-García", "Javier Villalba-Díez", "Ana González-Marcos", "Joaquín Ordieres-Meré"]
license = "AGPL-3.0-only"
readme = "README.md"
packages = [{include = "iabm_semantics"}]
include = [
    { path = "locales/**/*.po", format = ["sdist", "wheel"] },
    { path = "locales/messages.pot", format = ["sdist", "wheel"] }
]

[tool.poetry.dependencies]
python = "^3.10"
pandas = ">=2.1,<4"
pyarrow = ">=14"
openpyxl = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
industrial-semantics = "iabm_semantics.main:main"
