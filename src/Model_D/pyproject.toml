[tool.poetry]
name = "industrial-incidents-model-d"
version = "1.0.1"
description = "Multi-scale incident evidence, certified variational fourth-order transients, conformal fusion and episodes (Model D)"
authors = ["Antonio Bello-García", "Javier Villalba-Díez", "Ana González-Marcos", "Joaquín Ordieres-Meré"]
license = "AGPL-3.0-only"
readme = "README.md"
packages = [{include = "iabm_incidents"}]

[tool.poetry.dependencies]
python = "^3.10"
pandas = ">=2.1,<4"
numpy = ">=1.24,<3"
matplotlib = {version = ">=3.7,<4", optional = true}
pyarrow = ">=14"
openpyxl = "^3.1.0"
scikit-learn = {version = ">=1.3", optional = true}

[tool.poetry.extras]
analysis = ["matplotlib"]
experiments = ["scikit-learn", "matplotlib"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
industrial-incidents = "iabm_incidents.main:main"
